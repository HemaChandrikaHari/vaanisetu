services:
  - type: web
    name: vaanisetu-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_MODE
        value: live
      - key: SARVAM_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: capacitor://localhost,https://localhost
      - key: ENABLE_OUTBOUND_CALLS
        value: "false"
      - key: EXOTEL_AGENTSTREAM_PROTOCOL_VERIFIED
        value: "false"
      - key: MAX_CALL_SECONDS
        value: "300"
